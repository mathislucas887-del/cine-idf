<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ciné IDF – Pathé & CinéPass</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">🎬 Ciné IDF <small>Pathé & partenaires CinéPass</small></div>
<nav id="nav"><button data-v="map" class="on"><span class="ic">🗺️</span>Carte</button><button data-v="list"><span class="ic">🎦</span>Cinémas</button><button data-v="seances"><span class="ic">🎟️</span>Séances</button></nav></header>
<div id="banner" class="banner hidden"></div>
<main>
<section id="v-map" class="view on"><div class="filters mapbar"><input id="q" placeholder="Rechercher un cinéma, une ville…"><select id="ftype"><option value="">Tous</option><option value="pathe">Pathé</option><option value="partner">Partenaires CinéPass</option></select><span id="count"></span></div><div id="map"></div></section>
<section id="v-list" class="view"><div class="filters"><input id="q2" placeholder="Rechercher…"><select id="ftype2"><option value="">Tous</option><option value="pathe">Pathé</option><option value="partner">Partenaires CinéPass</option></select></div><div id="grid" class="grid"></div></section>
<section id="v-seances" class="view"><div class="filters">
<div class="picker" id="picker"><button id="pbtn" type="button">Choisir des cinémas ▾</button><div id="pmenu" class="pmenu hidden"><input id="psearch" placeholder="Rechercher un cinéma Pathé…"><div id="plist"></div></div></div><input id="sfilm" placeholder="Filtrer par film…"><select id="sver"><option value="">VF + VO</option><option value="vf">VF</option><option value="vost">VOST</option></select>
<button id="sload" class="primary">Afficher les séances</button></div><div id="chips" class="chips"></div><div id="sdates" class="dates"></div>
<p class="hint">Séances en direct depuis pathe.fr pour les cinémas Pathé (nécessite <code>python3 server.py</code>).</p>
<div id="progress"></div><div id="shows"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="mbox"><button class="x" onclick="closeModal()">×</button><div id="mcontent"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/cinemas.js"></script><script src="app.js"></script></body></html>
