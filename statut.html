<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statut du service – Ciné IDF</title><meta name="description" content="État du serveur Ciné IDF et de la source Allociné."><link rel="icon" href="/icon.svg"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><meta name="theme-color" content="#050505"></head><body><header><div class="top"><a class="brand" href="/" style="text-decoration:none">CINÉ<span>IDF</span></a></div></header><main class="pad prose" style="max-width:820px;margin:auto">
<h1>🟢 Statut du service</h1><div id="st"><p>Interrogation du serveur… (s’il était en veille, cela peut prendre ~50 s)</p></div>
<script>const t0=Date.now();const ago=s=>!s?"jamais":Math.round((Date.now()/1000-s)/60)+" min";fetch("/status.json",{cache:"no-store"}).then(r=>r.json()).then(x=>{const w=(Date.now()-t0)/1000;document.getElementById("st").innerHTML=`<p style="font-size:22px">${w>5?"😴 Le serveur était <b>en veille</b> : réveillé en "+w.toFixed(0)+" s":"✅ Serveur <b>réveillé</b> (réponse en "+w.toFixed(1)+" s)"}</p><ul><li>En ligne depuis ${Math.round(x.uptime_s/60)} min</li><li>Séances en cache : ${x.cache}</li><li>Allociné : dernière réponse OK il y a ${ago(x.allocine_last_ok)} · ${x.allocine_ok} requêtes OK, ${x.allocine_errors} erreurs ${x.throttled?"· ⏳ ralentissement en cours (file d’attente)":""}</li><li>Agenda avant-premières : ${x.agenda_at?"mis à jour il y a "+ago(x.agenda_at):"en construction"}</li></ul><p class="sub">Plan gratuit Render : mise en veille après 15 min sans visite ; un « ping » interne toutes les 10 min limite les mises en veille.</p>`}).catch(()=>document.getElementById("st").innerHTML="<p>❌ Serveur injoignable pour l’instant. Réessayez dans une minute.</p>")</script><p><a class="ghost" href="/">← Retour aux séances</a></p></main><footer class="foot"><a href="/comment-ca-marche.html">Comment ça marche</a> · <a href="/confidentialite.html">Confidentialité</a> · <a href="/statut.html">Statut</a></footer></body></html>
